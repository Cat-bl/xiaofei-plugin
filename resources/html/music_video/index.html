<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="{{data.plugin_path}}/resources/html/music_video/music.css" />
</head>
<body>
<div id="container">
  <% if (data.cover_url) { %>
  <div class="backdrop" style="background-image: url('<%= data.cover_url %>')"></div>
  <% } %>
  <div class="vignette"></div>
  <main class="stage">
    <section class="cover-section">
      <div class="album-frame">
        <% if (data.cover_url) { %>
        <div class="album-panel-bg" style="background-image: url('<%= data.cover_url %>')"></div>
        <% } %>
        <div class="album-glow"></div>
      </div>
      <div class="song-title">{{data.title}}</div>
      <div class="song-artist">{{data.artist}}</div>
    </section>
    <section class="lyric-panel"></section>
  </main>
</div>
</body>
</html>
